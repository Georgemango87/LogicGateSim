                inputsCount: innerInputs.length,
                outputsCount: innerOutputs.length,
                inputInitials,
                outputInitials,
                innerInputs: innerInputs.map(c => c.id),
                innerOutputs: innerOutputs.map(c => c.id),
                innerComps: storedInnerComps,
                innerWires: innerWires
            };

            savedCustomGates[gateName] = newDef;

            if (isReplacing) {
                const instances = components.filter(c => c.isCustom && c.type === gateName);
                const instanceData = instances.map(c => ({ id: c.id, x: c.x, y: c.y }));
                instanceData.forEach(data => {
                    const el = document.getElementById(`comp-${data.id}`);
                    if (el) el.remove();
                    components = components.filter(c => c.id !== data.id);
                    spawnCustomGateInstance(gateName, data.x, data.y);
                });
                wires = wires.filter(w => {
                    const fromExists = components.some(c => c.id === w.fromComp);
                    const toExists = components.some(c => c.id === w.toComp);
                    return fromExists && toExists;
                });
            }

            updateCustomGatesToolbar();
            saveToLocalStorage();
            runInstantaneousPass();
            drawWires();

            showToast(`Custom Gate "${gateName}" ${isReplacing ? 'updated' : 'saved'}! (${innerOutputs.length} output${innerOutputs.length>1?'s':''})`,
                'success');
        }

        // ─── custom gates toolbar ────────────────────────────────────
        function updateCustomGatesToolbar() {
            const group = document.getElementById('custom-gates-toolbar');
            group.innerHTML = '';
            for (const name in savedCustomGates) {
                const btn = document.createElement('div');
                btn.className = 'tool-btn';
                btn.style.background = (savedCustomGates[name].color || '#6f42c1');
                btn.innerText = name;
                btn.onmousedown = (e) => startGhostDrag(e, name);
                btn.ontouchstart = (e) => startGhostDrag(e, name);
                group.appendChild(btn);
            }
        }

        // ─── IC manager ──────────────────────────────────────────────
        function openICManager() {
            const list = document.getElementById('ic-modal-list');
            list.innerHTML = '';
            const keys = Object.keys(savedCustomGates);
            if (!keys.length) {
                list.innerHTML = '<div style="font-size:12px;color:gray;text-align:center;padding:10px;">No custom ICs saved yet.</div>';
            } else {
                keys.forEach(name => {
                    const item = document.createElement('div');
                    item.className = 'ic-item';
                    const def = savedCustomGates[name];
                    const safeColor = def.color || '#6f42c1';
                    item.innerHTML = `
                        <span><strong>${name}</strong> (${def.inputsCount} in, ${def.outputsCount} out)</span>
                        <div style="display:flex;gap:4px;align-items:center;">
                            <input class="ic-color-picker" type="color" value="${safeColor}" title="Custom gate color" onchange="setCustomGateColor('${name}', this.value)">
                            <button onclick="renameIC('${name}')" style="padding:2px 6px;font-size:10px;background:#2563eb;">Rename</button>
                            <button onclick="deleteIC('${name}')" style="padding:2px 6px;font-size:10px;background:#dc3545;">Delete</button>
                        </div>`;
                    list.appendChild(item);
                });
            }
            document.getElementById('ic-modal').style.display = 'flex';
        }

        function closeICManager() { document.getElementById('ic-modal').style.display = 'none'; }

        function closeICManagerOutside(e) { if (e.target.id === 'ic-modal') closeICManager(); }

        function setCustomGateColor(name, color) {
            const def = savedCustomGates[name];
            if (!def || !/^#[0-9a-fA-F]{6}$/.test(color)) return;
            def.color = color;
            components.forEach(c => {
                if (c.isCustom && c.type === name) {
                    c.def = def;
                    const el = document.getElementById(`comp-${c.id}`);
                    if (el) el.style.setProperty('--gate-color', color);
                }
            });
            updateCustomGatesToolbar();
            saveToLocalStorage();
            runInstantaneousPass();
        }

        async function renameIC(oldName) {
            const newName = prompt(`Enter new name for "${oldName}":`, oldName);
            if (!newName || !newName.trim() || newName.trim() === oldName) return;
            const trimmed = newName.trim();
            if (savedCustomGates[trimmed]) {
                showToast('A custom gate with that name already exists!', 'error');
                return;
            }
            savedCustomGates[trimmed] = savedCustomGates[oldName];
            savedCustomGates[trimmed].name = trimmed;
            delete savedCustomGates[oldName];
            components.forEach(c => { if (c.type === oldName) { c.type = trimmed;
                    c.def.name = trimmed; } });
            updateCustomGatesToolbar();
            saveToLocalStorage();
            openICManager();
            components.forEach(c => {
                if (c.type === trimmed) {
                    const el = document.getElementById(`comp-${c.id}`);
                    if (el) { const span = el.querySelector('.gate-header span');
                        if (span) span.innerText = trimmed; }
                }
            });
        }

        async function deleteIC(name) {
            const confirmed = await showConfirm('Delete Custom IC', `Delete "${name}" and all its instances?`);
            if (!confirmed) return;
            delete savedCustomGates[name];
            components = components.filter(c => {
                if (c.type === name) { const el = document.getElementById(`comp-${c.id}`);
                    if (el) el.remove(); return false; }
                return true;
            });
            wires = wires.filter(w => components.find(c => c.id === w.fromComp) && components.find(c => c.id === w.toComp));
            updateCustomGatesToolbar();
            drawWires();
            saveToLocalStorage();
            openICManager();
        }

        // ─── gate drag ───────────────────────────────────────────────
        let isDraggingGate = false,
            activeComp = null,
            gateStartX = 0,
            gateStartY = 0;

        function startDragGate(e, id) {
            if (e.target.tagName === 'BUTTON' || e.target.classList.contains('delete-btn') || e.target.tagName === 'INPUT')
                return;
            isDraggingGate = true;
            activeComp = components.find(c => c.id === id);
            const cx = e.clientX || (e.touches && e.touches[0].clientX);
            const cy = e.clientY || (e.touches && e.touches[0].clientY);
            gateStartX = (cx - viewport.getBoundingClientRect().left - panX) / zoom - activeComp.x;
            gateStartY = (cy - viewport.getBoundingClientRect().top - panY) / zoom - activeComp.y;
            e.stopPropagation();
        }

        window.addEventListener('mousemove', (e) => {
            if (isDraggingGate && activeComp) {
                const mx = (e.clientX - viewport.getBoundingClientRect().left - panX) / zoom;
                const my = (e.clientY - viewport.getBoundingClientRect().top - panY) / zoom;
                activeComp.x = snapValue(mx - gateStartX);
                activeComp.y = snapValue(my - gateStartY);
                const el = document.getElementById(`comp-${activeComp.id}`);
                if (el) { el.style.left = activeComp.x + 'px';
                    el.style.top = activeComp.y + 'px';
                    drawWires(); }
            }
        });
        window.addEventListener('touchmove', (e) => {
            if (isDraggingGate && activeComp && e.touches.length === 1) {
                const t = e.touches[0];
                const mx = (t.clientX - viewport.getBoundingClientRect().left - panX) / zoom;
                const my = (t.clientY - viewport.getBoundingClientRect().top - panY) / zoom;
                activeComp.x = snapValue(mx - gateStartX);
                activeComp.y = snapValue(my - gateStartY);
                const el = document.getElementById(`comp-${activeComp.id}`);
                if (el) { el.style.left = activeComp.x + 'px';
                    el.style.top = activeComp.y + 'px';
                    drawWires(); }
            }
        });
        window.addEventListener('mouseup', () => { if (isDraggingGate) saveToLocalStorage();
            isDraggingGate = false;
            activeComp = null; });
        window.addEventListener('touchend', () => { if (isDraggingGate) saveToLocalStorage();
            isDraggingGate = false;
            activeComp = null; });

        // ─── remove component ────────────────────────────────────────
        function removeComponent(id, skipSave) {
            components = components.filter(c => c.id !== id);
            wires = wires.filter(w => w.fromComp !== id && w.toComp !== id);
            const el = document.getElementById(`comp-${id}`);
            if (el) el.remove();
            runInstantaneousPass();
            drawWires();
            if (!skipSave) saveToLocalStorage();
        }

        // ─── toggle input ────────────────────────────────────────────
        function toggleInput(id) {
            const comp = components.find(c => c.id === id);
            if (!comp) return;
            comp.state = comp.state === 0 ? 1 : 0;
            comp.outputVal = comp.state;
            const btn = document.getElementById(`sw-${id}`);
            if (btn) { btn.classList.toggle('active');
                btn.innerText = comp.state === 1 ? 'ON' : 'OFF'; }
            runInstantaneousPass();
            saveToLocalStorage();
        }

        // ─── temp wire ───────────────────────────────────────────────
        function updateTempWire(cx, cy) {
            if (!draggingWire) return;
            const fRect = draggingWire.el.getBoundingClientRect();
            const cRect = canvas.getBoundingClientRect();
            const x1 = (fRect.left + fRect.width / 2 - cRect.left) / zoom;
            const y1 = (fRect.top + fRect.height / 2 - cRect.top) / zoom;
            const x2 = (cx - cRect.left) / zoom;
            const y2 = (cy - cRect.top) / zoom;
            const dx = Math.abs(x2 - x1) * 0.5;
            const tw = document.getElementById('temp-wire');
            tw.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
        }

        function resetWiring() {
            draggingWire = null;
            const tw = document.getElementById('temp-wire');
            if (tw) { tw.setAttribute('visibility', 'hidden');
                tw.setAttribute('d', ''); }
        }

        // ─── simulation ──────────────────────────────────────────────
        function evaluateGateOutputs(comp, inputs) {
            if (comp.type === 'INPUT') return comp.state;
            if (comp.type === 'AND') return (inputs[0] === 1 && inputs[1] === 1) ? 1 : 0;
            if (comp.type === 'OR') return (inputs[0] === 1 || inputs[1] === 1) ? 1 : 0;
            if (comp.type === 'XOR') return (inputs[0] !== inputs[1]) ? 1 : 0;
            if (comp.type === 'NOT') return inputs[0] === 1 ? 0 : 1;
            if (comp.type === 'NAND') return !(inputs[0] === 1 && inputs[1] === 1) ? 1 : 0;
            if (comp.type === 'NOR') return !(inputs[0] === 1 || inputs[1] === 1) ? 1 : 0;
            if (comp.type === 'XNOR') return (inputs[0] === inputs[1]) ? 1 : 0;
            if (comp.type === 'OUTPUT') return inputs[0];
            return 0;
        }

        function evaluateCustomGateInstance(comp) {
            const sub = comp.subComps || [];
            const sw = comp.subWires || [];
            if (!sub.length) {
                comp.outputsArray = new Array((comp.def && comp.def.outputsCount) || 0).fill(0);
                comp.outputVal = 0;
                return;
            }

            const byId = new Map(sub.map(sc => [sc.id, sc]));
            const inputs = sub.filter(sc => sc.type === 'INPUT').sort((a, b) => a.y - b.y);
            inputs.forEach((ic, i) => {
                const v = comp.inputs[i] === 1 ? 1 : 0;
                ic.state = v;
                ic.outputVal = v;
            });

            for (let pass = 0; pass < Math.max(8, sub.length * 2); pass++) {
                sub.forEach(sc => {
                    if (sc.type === 'INPUT') return;
                    sc.inputs = (sc.inputs || []).map(() => 0);
                    sc.inputs.forEach((_, sidx) => {
                        const inc = sw.find(w => w.toComp === sc.id && w.toPort === sidx);
                        if (!inc) return;
                        const src = byId.get(inc.fromComp);
                        sc.inputs[sidx] = src ? (src.isCustom
                            ? (src.outputsArray && src.outputsArray[inc.fromPort] !== undefined ? src.outputsArray[inc.fromPort] : 0)
                            : (src.outputVal === 1 ? 1 : 0)) : 0;
                    });

                    if (sc.type === 'DELAY') {
                        if (comp.delayStates && comp.delayStates[sc.id]) {
                            const st = comp.delayStates[sc.id];
                            sc.outputVal = st.queue[st.ptr] || 0;
                        } else {
                            sc.outputVal = 0;
                        }
                    } else if (sc.isCustom) {
                        evaluateCustomGateInstance(sc);
                    } else {
                        sc.outputVal = evaluateGateOutputs(sc, sc.inputs);
                    }
                });
            }

            const outputs = sub.filter(sc => sc.type === 'OUTPUT').sort((a, b) => a.y - b.y);
            comp.outputsArray = outputs.map(oc => oc.outputVal === 1 ? 1 : 0);
            comp.outputVal = comp.outputsArray[0] || 0;
        }

        function runInstantaneousPass() {
            for (let pass = 0; pass < Math.max(8, components.length * 2); pass++) {
                components.forEach(comp => {
                    comp.inputs = (comp.inputs || []).map(() => 0);
                    comp.inputs.forEach((_, idx) => {
                        const inc = wires.find(w => w.toComp === comp.id && w.toPort === idx);
                        if (!inc) return;
                        const src = components.find(c => c.id === inc.fromComp);
                        if (!src) return;
                        comp.inputs[idx] = src.isCustom
                            ? (src.outputsArray && src.outputsArray[inc.fromPort] !== undefined ? src.outputsArray[inc.fromPort] : 0)
                            : (src.outputVal === 1 ? 1 : 0);
                    });

                    if (comp.isCustom) {
                        evaluateCustomGateInstance(comp);
                    } else if (comp.type !== 'DELAY') {
                        comp.outputVal = evaluateGateOutputs(comp, comp.inputs);
                    }
                });
            }
            updateVisuals();
        }

        function advanceSimulationTick() {
            components.forEach(comp => {
                comp.inputs.forEach((_, idx) => {
                    const inc = wires.find(w => w.toComp === comp.id && w.toPort === idx);
                    if (inc) {
                        const src = components.find(c => c.id === inc.fromComp);
                        if (src) {
                            if (src.isCustom && inc.fromPort !== undefined) {
                                comp.inputs[idx] = src.outputsArray[inc.fromPort] !== undefined ? src
                                    .outputsArray[inc.fromPort] : 0;
                            } else { comp.inputs[idx] = src.outputVal; }
                        } else { comp.inputs[idx] = 0; }
                    } else { comp.inputs[idx] = 0; }
                });

                if (comp.type === 'DELAY') {
                    if (!comp.delayQueue) { comp.delayVal = comp.delayVal || 3;
                        comp.delayQueue = new Array(comp.delayVal).fill(0); }
                    const inputVal = comp.inputs[0];
                    comp.outputVal = comp.delayQueue[0];
                    comp.delayQueue.shift();
                    comp.delayQueue.push(inputVal);
                } else if (comp.isCustom) {
                    const sub = comp.subComps;
                    const sw = comp.subWires;
                    const subInputs = comp.inputs;

                    const inComps = sub.filter(c => c.type === 'INPUT');
                    inComps.sort((a, b) => a.y - b.y);
                    inComps.forEach((ic, i) => { ic.outputVal = subInputs[i] !== undefined ? subInputs[i] : 0; });

                    sub.forEach(sc => {
                        sc.inputs.forEach((_, sidx) => {
                            const inc = sw.find(w => w.toComp === sc.id && w.toPort === sidx);
                            if (inc) {
                                const src = sub.find(s => s.id === inc.fromComp);
                                sc.inputs[sidx] = src ? src.outputVal : 0;
                            } else { sc.inputs[sidx] = 0; }
                        });
                        if (sc.type === 'DELAY') {
                            if (!comp.delayStates) comp.delayStates = {};
                            if (!comp.delayStates[sc.id]) {
                                comp.delayStates[sc.id] = { queue: new Array(sc.delayVal || 3).fill(0),
                                    ptr: 0 };
                            }
                            const st = comp.delayStates[sc.id];
                            const delayedVal = st.queue[st.ptr];
                            st.queue[st.ptr] = sc.inputs[0];
                            st.ptr = (st.ptr + 1) % st.queue.length;
                            sc.outputVal = delayedVal;
                        } else if (sc.type !== 'INPUT') {
                            sc.outputVal = evaluateGateOutputs(sc, sc.inputs);
                        }
                    });

                    const outComps = sub.filter(c => c.type === 'OUTPUT');
                    outComps.sort((a, b) => a.y - b.y);
                    comp.outputsArray = outComps.map(oc => oc.outputVal);
                    comp.outputVal = comp.outputsArray.length > 0 ? comp.outputsArray[0] : 0;
                }
            });
            runInstantaneousPass();
        }

        function stepSimulation() { advanceSimulationTick(); }

        setInterval(() => { if (!isPaused) advanceSimulationTick(); }, 200);

        // ─── visuals ─────────────────────────────────────────────────
        function updateVisuals() {
            components.forEach(comp => {
                const el = document.getElementById(`comp-${comp.id}`);
                if (!el) return;
                let powered = comp.outputVal === 1;
                if (comp.isCustom && comp.outputsArray && comp.outputsArray.length) {
                    powered = comp.outputsArray.some(v => v === 1);
                }
                el.classList.toggle('powered', powered);

                if (comp.type === 'OUTPUT') {
                    const bulb = document.getElementById(`bulb-${comp.id}`);
                    if (bulb) bulb.classList.toggle('on', comp.outputVal === 1);
                }
                comp.inputs.forEach((val, idx) => {
                    const p = document.getElementById(`port-${comp.id}-in-${idx}`);
                    if (p) p.classList.toggle('active-port', val === 1);
                });
                if (comp.isCustom) {
                    comp.outputsArray.forEach((val, idx) => {
                        const p = document.getElementById(`port-${comp.id}-out-${idx}`);
                        if (p) p.classList.toggle('active-port', val === 1);
                    });
                } else {
                    const p = document.getElementById(`port-${comp.id}-out-0`);
                    if (p) p.classList.toggle('active-port', comp.outputVal === 1);
                }
            });
            wires.forEach((wire, idx) => {
                const p = document.getElementById(`wire-${idx}`);
                if (p) {
                    const src = components.find(c => c.id === wire.fromComp);
                    if (src) {
                        let pw = false;
                        if (src.isCustom && wire.fromPort !== undefined) {
                            pw = src.outputsArray[wire.fromPort] === 1;
                        } else { pw = src.outputVal === 1; }
                        p.classList.toggle('powered', pw);
                    }
                }
            });
        }

        // ─── draw wires (with click and mousedown handlers) ────────
        function drawWires() {
            svgWires.innerHTML =
                '<path id="temp-wire" d="" stroke="#e83e8c" stroke-width="3" stroke-dasharray="5,5" fill="none" visibility="hidden" />';

            wires.forEach((wire, idx) => {
                const fromEl = document.querySelector(
                    `[data-comp="${wire.fromComp}"][data-type="out"][data-port="${wire.fromPort}"]`);
                const toEl = document.querySelector(
                    `[data-comp="${wire.toComp}"][data-type="in"][data-port="${wire.toPort}"]`);
                if (fromEl && toEl) {
                    const fRect = fromEl.getBoundingClientRect();
                    const tRect = toEl.getBoundingClientRect();
                    const cRect = canvas.getBoundingClientRect();
                    const x1 = (fRect.left + fRect.width / 2 - cRect.left) / zoom;
                    const y1 = (fRect.top + fRect.height / 2 - cRect.top) / zoom;
                    const x2 = (tRect.left + tRect.width / 2 - cRect.left) / zoom;
                    const y2 = (tRect.top + tRect.height / 2 - cRect.top) / zoom;
                    const dx = Math.abs(x2 - x1) * 0.5;
                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`);
                    path.setAttribute('class', 'wire-path');
                    path.setAttribute('id', `wire-${idx}`);

                    path.onclick = (e) => {
                        e.stopPropagation();
                        wires.splice(idx, 1);
                        runInstantaneousPass();
                        drawWires();
                        saveToLocalStorage();
                        showToast('Wire deleted.', 'info', 1500);
                    };
                    path.onmousedown = (e) => e.stopPropagation();
                    path.ontouchstart = (e) => e.stopPropagation();

                    svgWires.appendChild(path);
                }
            });
            updateVisuals();
        }

        // ─── clear all ───────────────────────────────────────────────
        async function clearAll() {
            const confirmed = await showConfirm('Clear Everything', 'Are you sure you want to clear everything?');
            if (!confirmed) return;
            components = [];
            wires = [];
            customContainers = [];
            savedCustomGates = {};
            canvas.innerHTML =
                '<div id="grid-bg" onmousedown="startPan(event)" ontouchstart="startTouchPanZoom(event)"></div><svg id="wires"><path id="temp-wire" d="" stroke="#e83e8c" stroke-width="3" stroke-dasharray="5,5" fill="none" visibility="hidden" /></svg>';
            updateCustomGatesToolbar();
            resetWiring();
            localStorage.removeItem('logic_sim_save_state_v3');
            localStorage.removeItem('logic_sim_save_state_v2');
            localStorage.removeItem('logic_sim_save_state');
            showToast('All cleared.', 'info');
        }

        // ─── init ────────────────────────────────────────────────────
        window.addEventListener('load', () => {
            loadFromLocalStorage();
            updateTransform();
            updateCustomGatesToolbar();
            customContainers.forEach(cont => renderCustomContainer(cont));
            components.forEach(comp => renderComponent(comp));
            drawWires();
            runInstantaneousPass();
            console.log('✅ Logic Simulator loaded with nested custom gate support!');
        });

        // Expose all functions to global
        window.startGhostDrag = startGhostDrag;
        window.togglePause = togglePause;
        window.stepSimulation = stepSimulation;
        window.resetView = resetView;
        window.toggleTheme = toggleTheme;
        window.clearAll = clearAll;
        window.openICManager = openICManager;
        window.closeICManager = closeICManager;
        window.closeICManagerOutside = closeICManagerOutside;
        window.renameIC = renameIC;
        window.setCustomGateColor = setCustomGateColor;
        window.deleteIC = deleteIC;
        window.deleteCustomGate = deleteCustomGate;
        window.expandCustomGate = expandCustomGate;
        window.saveCustomGate = saveCustomGate;
        window.removeCustomContainer = removeCustomContainer;
        window.removeComponent = removeComponent;
        window.startDragContainer = startDragContainer;
        window.startResizeContainer = startResizeContainer;
        window.updateContainerTitle = updateContainerTitle;
        window.startDragGate = startDragGate;
        window.toggleInput = toggleInput;
        window.closeConfirm = closeConfirm;
        window.closeConfirmOutside = closeConfirmOutside;
        window.showToast = showToast;
        window.showConfirm = showConfirm;
        window.startPan = startPan;
        window.startTouchPanZoom = startTouchPanZoom;
        window.handleZoom = handleZoom;
        window.exportCircuit = exportCircuit;
        window.importCircuit = importCircuit;

        console.log('✅ All functions registered globally.');
    </script>
</body>
</html>
